# Import this file from a project's mago.toml with:
# extends = "vendor/cakephp/mago-rules/cakephp.mago.toml"

[extension-hosts.cakephp]
command = ["php", "vendor/cakephp/mago-rules/bin/mago-cakephp-worker"]

# Mago owns generic formatting. These settings pin the CakePHP-specific
# choices that differ from, or are important additions to, PSR-12.
[formatter]
excludes = ["**/templates/**"]
preset = "psr-12"
print-width = 120
tab-width = 4
use-tabs = false
single-quote = true
trailing-comma = true
expand-use-groups = true
sort-uses = "alphanumeric-ascending"
space-after-cast-unary-prefix-operators = false
empty-line-after-opening-tag = false
space-around-assignment-in-declare = false
space-after-logical-not-unary-prefix-operator = false
space-within-grouping-parenthesis = false
preserve-breaking-argument-list = true
preserve-breaking-parameter-list = true
preserve-breaking-attribute-list = true
preserve-breaking-conditional-expression = true
preserve-breaking-condition-expression = true
preserve-breaking-binary-expression = true
first-method-chain-on-new-line = false
preserve-breaking-member-access-chain = true
preserve-breaking-member-access-chain-first-method-on-same-line = true
empty-line-before-return = true
omit-redundant-arithmetic-binary-expression-parentheses = true
preserve-redundant-logical-binary-expression-parentheses = true
separate-use-types = false
break-promoted-properties-list = false

[linter]
integrations = ["phpunit"]

# Start from Mago's useful default catalogue while disabling language
# preferences that conflict with established CakePHP practices.
# Consuming projects remain free to override any rule.
[linter.rules]
assertion-style = { enabled = true, level = "error", style = "this" }

# Framework-facing classes expose actions, finders, helpers, and persisted fields.
# Keep native size checks active outside these conventional CakePHP paths.
too-many-methods = { exclude = ["**/src/Controller/**", "**/src/Model/Table/**", "**/src/View/Helper/**"] }
too-many-properties = { exclude = ["**/src/Model/Entity/**"] }

array-style = { enabled = true, level = "error", style = "short" }
block-statement = { enabled = true, level = "error" }
no-short-opening-tag = { enabled = true, level = "error" }
no-error-control-operator = { enabled = true, level = "error" }
no-assign-in-condition = { enabled = true, level = "error", ignore-while-statements = false }
no-redundant-parentheses = { enabled = true, level = "error" }
no-redundant-final = { enabled = true, level = "error" }
no-fully-qualified-global-class-like = { enabled = true, level = "error" }
no-redundant-use = { enabled = true, level = "error" }
no-closing-tag = { enabled = true, level = "error" }
ambiguous-function-call = { enabled = false }
no-else-clause = { enabled = false }
no-shorthand-ternary = { enabled = false }

# CakePHP permits value equality, positional arguments, empty(), and isset().
identity-comparison = { enabled = false }
literal-named-argument = { enabled = false }
no-empty = { enabled = false }
no-isset = { enabled = false }
